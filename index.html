/* ---------------------------------------------------------------------
   17. 鏡頭：總覽、飛到設施、面板讓位、閒置自轉
   --------------------------------------------------------------------- */
function overviewPose() {
  const fovHalf = THREE.MathUtils.degToRad(camera.fov) / 2;
  const d = clamp(34 / (Math.tan(fovHalf) * Math.min(camera.aspect, 1.7)), 50, 150);
  const target = V(0, 2.5, 0);
  return { pos: target.clone().addScaledVector(V(0.28, 0.5, 0.82).normalize(), d), target };
}
function focusPose(key) {
  const L = LAYOUT[key], base = V(L.x, 0, L.z);
  const target = V(...L.focus).applyAxisAngle(UP, L.yaw).add(base);
  const pos = V(...L.cam).applyAxisAngle(UP, L.yaw).add(base);
  if (camera.aspect < 0.8) pos.sub(target).multiplyScalar(1.4).add(target); // 直式手機退遠一點
  return { pos, target };
}

let flight = null;
function flyTo({ pos, target }, instant) {
  if (instant || REDUCED) {
    flight = null;
    camera.position.copy(pos);
    controls.target.copy(target);
    controls.enabled = true;
    controls.update();
    return;
  }
  const d = camera.position.distanceTo(pos);
  flight = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: target, k: 0, dur: clamp(0.9 + d / 60, 1.1, 2.2), lift: Math.min(7, d * 0.12) };
  controls.enabled = false;
}
function stepFlight(dt) {
  flight.k = Math.min(1, flight.k + dt / flight.dur);
  const k = flight.k, e = k < 0.5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2;
  camera.position.lerpVectors(flight.p0, flight.p1, e);
  camera.position.y += Math.sin(Math.PI * e) * flight.lift;
  controls.target.lerpVectors(flight.t0, flight.t1, e);
  camera.lookAt(controls.target);
  if (k >= 1) { flight = null; controls.enabled = true; controls.update(); }
}

// 面板打開時，把畫面中心往沒被擋住的地方挪
const inset = new THREE.Vector2(), insetTarget = new THREE.Vector2();
function applyView() {
  const w = innerWidth, h = innerHeight;
  camera.setViewOffset(w, h, inset.x, inset.y, w, h);
  camera.updateProjectionMatrix();
}
function stepInset(dt) {
  if (inset.equals(insetTarget)) return;
  if (REDUCED || inset.distanceTo(insetTarget) < 0.5) inset.copy(insetTarget);
  else inset.lerp(insetTarget, 1 - Math.exp(-dt * 7));
  applyView();
}

let lastActive = performance.now();
const markActive = () => { lastActive = performance.now(); };
['pointerdown', 'pointermove', 'wheel', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, markActive, { passive: true }));
controls.addEventListener('start', () => { markActive(); flight = null; });

/* ---------------------------------------------------------------------
   18. 滑鼠／觸控：點設施開面板、點天空放煙火、滑過設施亮標籤
   --------------------------------------------------------------------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const canvas = renderer.domElement;
const activePointers = new Set();
let down = null, multi = false, hoverDirty = false, hoverKey = null, pointerType = 'mouse';

function setNdc(e) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
}
function setHover(key) {
  if (key === hoverKey) return;
  hoverKey = key;
  canvas.style.cursor = key ? 'pointer' : '';
  UI.setHover(key);
}
function hitKey() {
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(solids, false)[0];
  return hit ? (hit.object.userData.key || '') : null; // null＝天空，''＝地面
}
canvas.addEventListener('pointerdown', e => {
  activePointers.add(e.pointerId);
  if (activePointers.size > 1) multi = true;
  if (activePointers.size === 1) { multi = false; down = { x: e.clientX, y: e.clientY, t: performance.now() }; }
});
const endPointer = e => {
  activePointers.delete(e.pointerId);
  if (e.type === 'pointerup' && !multi && down && activePointers.size === 0) {
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    if (moved < 8 && performance.now() - down.t < 600) handleTap(e);
  }
  if (activePointers.size === 0) down = null;
};
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointermove', e => { pointerType = e.pointerType; setNdc(e); hoverDirty = true; });
canvas.addEventListener('pointerleave', () => setHover(null));

function handleTap(e) {
  setNdc(e);
  const key = hitKey();
  if (key) { UI.open(key); return; }
  if (key === '') return;
  // 點到天空
  if (night > 0.5) {
    const ray = raycaster.ray;
    const end = ray.origin.clone().addScaledVector(ray.direction, camera.position.distanceTo(controls.target) + 12);
    end.y = clamp(end.y, 14, 46);
    const hr = Math.hypot(end.x, end.z);
    if (hr > 42) { end.x *= 42 / hr; end.z *= 42 / hr; }
    launchFirework(end);
  } else {
    UI.toast(CONTENT.ui.fireworksNeedNight, 3200);
  }
}
function updateHover() {
  if (!hoverDirty || pointerType !== 'mouse' || activePointers.size) return;
  hoverDirty = false;
  setHover(hitKey() || null);
}

/* ---------------------------------------------------------------------
   19. 浮動標籤：投影到螢幕上，疊到就往上推
   --------------------------------------------------------------------- */
const labelEls = UI.labelEls;
const labelSize = {};
function measureLabels() {
  for (const k in labelEls) labelSize[k] = { w: labelEls[k].offsetWidth, h: labelEls[k].offsetHeight + 3 };
}
const pv = new THREE.Vector3();
function layoutLabels() {
  const W = innerWidth, H = innerHeight, items = [];
  for (const key of CONTENT.order) {
    const f = facilities[key], el = labelEls[key], sz = labelSize[key];
    if (!f || !el || !sz) continue;
    f.anchor.getWorldPosition(pv).project(camera);
    if (pv.z > 1 || pv.z < -1 || Math.abs(pv.x) > 1.4 || Math.abs(pv.y) > 1.4) {
      if (el._shown !== false) { el.style.visibility = 'hidden'; el._shown = false; }
      continue;
    }
    const x = (pv.x * 0.5 + 0.5) * W, y = (-pv.y * 0.5 + 0.5) * H;
    items.push({ el, y, w: sz.w, h: sz.h, left: x - sz.w / 2, top: y - 10 - sz.h });
  }
  // 從畫面最下面的開始放；跟已經放好的重疊，就推到它上面，一直推到不重疊為止
  items.sort((a, b) => b.y - a.y);
  const GAP = 6, placed = [];
  for (const it of items) {
    for (let guard = 0, moved = true; moved && guard < 30; guard++) {
      moved = false;
      for (const p of placed) {
        const overlapX = it.left < p.left + p.w + GAP && it.left + it.w + GAP > p.left;
        const overlapY = it.top < p.top + p.h + GAP && it.top + it.h + GAP > p.top;
        if (overlapX && overlapY) { it.top = p.top - GAP - it.h; moved = true; }
      }
    }
    placed.push(it);
  }
  placed.forEach((it, i) => {
    const el = it.el;
    if (el._shown !== true) { el.style.visibility = ''; el._shown = true; }
    el.style.transform = `translate3d(${it.left.toFixed(1)}px, ${it.top.toFixed(1)}px, 0)`;
    el.style.setProperty('--stem', Math.max(0, it.y - it.top - it.h).toFixed(1) + 'px');
    el.style.zIndex = String(20 - i);
  });
}

/* ---------------------------------------------------------------------
   20. 視窗大小、主迴圈、給 UI 用的 World 介面
   --------------------------------------------------------------------- */
function onResize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.fov = w / h < 0.8 ? 55 : 42;
  applyView();
  measureLabels();
}
window.addEventListener('resize', onResize);
onResize();
if (document.fonts) document.fonts.ready.then(measureLabels);

let firstNight = true;
window.World = {
  focus(key, opts = {}) { if (LAYOUT[key]) flyTo(focusPose(key), opts.instant); },
  home(opts = {}) { flyTo(overviewPose(), opts.instant); },
  setNight(on) {
    nightTarget = on ? 1 : 0;
    if (on && firstNight && !REDUCED) {
      firstNight = false;
      setTimeout(() => launchFirework(V(rr(-10, 10), 24, rr(-16, -6))), 1300);
    }
  },
  setPaused(p) { paused = p; },
  setInset(right, bottom) { insetTarget.set(right / 2, bottom / 2); }
};

// 開場：從遠處飛進來
const home = overviewPose();
camera.position.copy(home.pos).multiplyScalar(1.7).add(V(0, 18, 0));
controls.target.copy(home.target);
camera.lookAt(home.target);
applyNight();
flyTo(home, false);

let firstFrame = true;
renderer.setAnimationLoop(time => {
  timer.update(time);
  const dt = clamp(timer.getDelta(), 0, 0.05); // 第一格可能是負的（rAF 時間早於 Timer 建立），夾在 0 以上
  if (document.body.classList.contains('classic-open')) return; // Classic view 開著時不畫，省電

  if (night !== nightTarget) {
    night += clamp(nightTarget - night, -dt / 1.4, dt / 1.4);
    applyNight();
  }
  for (const g of glows) g.m.emissiveIntensity = g.day + (g.night - g.day) * night;

  const adt = paused ? 0 : dt;
  animT += adt;
  world.position.y = Math.sin(animT * 0.5) * 0.22;
  for (const fn of animators) fn(animT, adt);
  stepFireworks(dt);
  cloudFade(dt);

  stepInset(dt);
  if (flight) {
    stepFlight(dt);
  } else {
    controls.autoRotate = !paused && performance.now() - lastActive > 5000;
    controls.maxPolarAngle = camera.position.distanceTo(controls.target) < 45 ? Math.PI * 0.47 : Math.PI * 0.58;
    controls.update(dt);
    const t = controls.target, r = Math.hypot(t.x, t.z);
    if (r > 32) { t.x *= 32 / r; t.z *= 32 / r; }
    t.y = clamp(t.y, -8, 16);
  }

  updateHover();
  renderer.render(scene, camera);
  layoutLabels();

  if (firstFrame) { firstFrame = false; UI.worldReady(); }
});
</script>
</body>
</html>
